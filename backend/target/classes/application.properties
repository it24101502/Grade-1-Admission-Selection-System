# ================================================================
#  Grade 1 Admission System — application.properties
#
#  TWO databases:
#   admission_apps   → parent accounts + application forms (submitted by parents)
#   admission_system → everything internal (staff, users, marking schemes, scores, flags)
#
#  IMPORTANT: Because this project uses dual DataSources with manually
#  configured EntityManagerFactory beans (SystemDataSourceConfig.java and
#  AppsDataSourceConfig.java), the spring.jpa.* global properties below
#  are NOT picked up by Hibernate automatically. ddl-auto, dialect, and
#  show-sql are each set directly inside the @Bean methods in those config
#  classes via the properties Map. The lines here are kept only as a
#  reference — change them in the config classes, not here.
# ================================================================

server.port=8080

# ── System DB (primary) — admission_system ────────────────────
# Stores: SystemUser, User, MarkingScheme, MarkingCriterion
spring.datasource.system.url=jdbc:mysql://localhost:3306/admission_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.system.username=root
spring.datasource.system.password=root
spring.datasource.system.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Apps DB (secondary) — admission_apps ──────────────────────
# Stores: Parent, Application
spring.datasource.apps.url=jdbc:mysql://localhost:3306/admission_apps?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.apps.username=root
spring.datasource.apps.password=root
spring.datasource.apps.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA (reference only — actual config is in DataSourceConfig beans) ─
# ddl-auto, dialect, and show-sql are set per-datasource in:
#   SystemDataSourceConfig.java  →  systemEntityManagerFactory
#   AppsDataSourceConfig.java    →  appsEntityManagerFactory
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────
# Secret must be at least 32 characters for HS256
app.jwt.secret=Grade1AdmissionSystemSecretKey32CharsMinimum2025!!
# Token expiry: 86400000 ms = 24 hours
app.jwt.expiration-ms=86400000

# ── School GPS coordinates (used for Haversine distance calc) ─
# Replace with your school's actual coordinates
school.latitude=6.9271
school.longitude=79.8612

# ── CORS — origins allowed to call this API ───────────────────
# Add comma-separated origins for production, e.g.:
# app.cors.allowed-origins=http://localhost:3000,https://yourdomain.com
app.cors.allowed-origins=http://localhost:3000